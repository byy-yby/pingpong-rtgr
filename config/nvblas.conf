# NVBLAS 配置文件（修复「CPU Blas library need to be provided」段错误）
#
# 背景：CUDA 12.9 的 libcublas 在初始化时会 dlopen libnvblas.so.12（nvidia-cublas-cu12
# 自带），而 libnvblas 是 BLAS 符号拦截器：一旦加载，进程内后续 CPU BLAS 调用可能被
# 路由到它。它需要一个 CPU BLAS 回退库（在 nvblas.conf 里用 NVBLAS_CPU_BLAS_LIB 指定），
# 否则当某个 BLAS 调用走 CPU 回退时会打印上述消息并段错误（实测 live_control 中
# 按 P 创建 RTMPose+TensorRT 检测器后崩溃，退出码 139）。
#
# 这里指向 conda 环境 tt 的 OpenBLAS。若换了 conda 环境/路径，改下面一行即可；
# live_control.py 通过 NVBLAS_CONFIG_FILE 环境变量指向本文件。

NVBLAS_CPU_BLAS_LIB /home/yby/miniconda3/envs/tt/lib/libopenblasp-r0.3.34.so
